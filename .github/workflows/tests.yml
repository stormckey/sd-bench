name: tests
on:
  push:
  pull_request:
jobs:
  no-gpu:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Validate configs, dataset sampling, and method adapters (no GPU, no model download)
        run: PYTHONPATH=src python -m unittest discover -s tests -v
